# Copied from .github/workflows/autoeval-suite-gate.yml.example in
# AlchemyInCode/plumloom-autoeval-oss (main, 5c4eb23, the v0.1.5 release).
# Changes for this QA demo, each marked "QA change" below:
#   1. The judge and primary model IDs come from secrets instead of variables,
#      so GitHub masks them in this repository's public logs (the example
#      already keeps the workspace ID in a secret).
#   2. A step prints the installed CLI path and version, so the public log
#      proves the published @plumloom/cli@0.1.5 package runs, not a local build.
# Repository secrets: AUTOEVAL_API_KEY, AUTOEVAL_WORKSPACE_ID,
# AUTOEVAL_JUDGE_MODEL_ID and AUTOEVAL_PRIMARY_MODEL_ID.
# The workflow always reads evals/autoeval.suite.yaml.
# Until 2026-10-16 this workflow built the CLI from feat/pr-reliability-report
# at bf58d8b; the earlier runs are in each pull request's checks history.
name: Autoeval suite gate

on:
  pull_request:

permissions:
  contents: read
  # Required only for the same-repository reliability report comment.
  pull-requests: write

jobs:
  gate:
    # Pull requests from forks do not receive repository secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      AUTOEVAL_API_KEY: ${{ secrets.AUTOEVAL_API_KEY }}
      AUTOEVAL_WORKSPACE_ID: ${{ secrets.AUTOEVAL_WORKSPACE_ID }}
      # QA change 1: the model IDs come from secrets so the public log masks them.
      AUTOEVAL_JUDGE_MODEL_ID: ${{ secrets.AUTOEVAL_JUDGE_MODEL_ID }}
      AUTOEVAL_PRIMARY_MODEL_ID: ${{ secrets.AUTOEVAL_PRIMARY_MODEL_ID }}
      AUTOEVAL_PR_RELIABILITY_COMMENT: 'true'
      # Use a stable, unique value per matrix cell when adding a matrix strategy.
      AUTOEVAL_REPORT_MATRIX_ID: default
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinning prevents CLI-version drift and improves reproducibility, but model
      # and judge behavior can still make evaluation results vary between runs.
      - run: npm install --global @plumloom/cli@0.1.5
      # QA change 2: prove which CLI runs.
      - name: Show which CLI runs
        shell: bash
        run: |
          set -euo pipefail
          echo "CLI path: $(command -v autoeval)"
          echo "CLI version: $(autoeval --version)"
          npm ls --global @plumloom/cli --depth=0
          test "$(autoeval --version)" = "0.1.5"
      - name: Verify runtime configuration
        run: |
          test -n "$AUTOEVAL_API_KEY"
          test -n "$AUTOEVAL_WORKSPACE_ID"
          test -n "$AUTOEVAL_JUDGE_MODEL_ID"
      - name: Pre-flight
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            --manifest evals/autoeval.suite.yaml
            --workspace "$AUTOEVAL_WORKSPACE_ID"
            --judge-model-id "$AUTOEVAL_JUDGE_MODEL_ID"
          )
          if [[ -n "${AUTOEVAL_PRIMARY_MODEL_ID:-}" ]]; then
            arguments+=(--primary-model-id "$AUTOEVAL_PRIMARY_MODEL_ID")
          fi
          autoeval doctor "${arguments[@]}"
      - name: Release gate
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            --manifest evals/autoeval.suite.yaml
            --workspace "$AUTOEVAL_WORKSPACE_ID"
            --judge-model-id "$AUTOEVAL_JUDGE_MODEL_ID"
          )
          if [[ -n "${AUTOEVAL_PRIMARY_MODEL_ID:-}" ]]; then
            arguments+=(--primary-model-id "$AUTOEVAL_PRIMARY_MODEL_ID")
          fi
          autoeval suite gate "${arguments[@]}"
